# Holt Videos aus dem Google-Drive-Ordner "YouTube-Upload" und lädt sie auf YouTube.
# Läuft stündlich von selbst; sofort starten: GitHub → Actions → "YouTube-Upload" → Run workflow.
name: YouTube-Upload

on:
  schedule:
    - cron: "23 * * * *" # jede Stunde um :23 (UTC); GitHub startet oft ein paar Minuten später
  workflow_dispatch:

concurrency:
  group: youtube-upload # nie zwei Läufe gleichzeitig → keine Doppel-Uploads
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Login vorhanden?
        id: check
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo "::notice::Secret YOUTUBE_TOKEN_JSON fehlt noch – siehe youtube-uploader/README.md. Übersprungen."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: youtube-uploader/requirements.txt

      - name: Abhängigkeiten installieren
        if: steps.check.outputs.ready == 'true'
        run: pip install -r youtube-uploader/requirements.txt

      - name: Drive-Ordner abarbeiten
        if: steps.check.outputs.ready == 'true'
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YT_DRIVE_FOLDER: YouTube-Upload
          PYTHONUNBUFFERED: "1"
        run: python youtube-uploader/upload.py drive
